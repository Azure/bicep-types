name: Build

on:
  push:
    tags:
    - 'latest'
    - 'v*'
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CI: true
  # don't print dotnet logo
  DOTNET_NOLOGO: true
  # disable telemetry (reduces dotnet tool output in logs)
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-dotnet:
    name: Build Dotnet
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp

      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      
      - name: Build
        run: dotnet build --configuration release

      - name: Pack
        run: dotnet pack --configuration release

      - name: Upload Nuget packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bicep-types-packages
          path: ./out/*
          if-no-files-found: error

      - name: Test
        run: dotnet test --configuration release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  build-npm:
    name: Build NPM
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript
  
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 16.x
      
      - name: Install
        run: npm ci
        working-directory: ./src/bicep-types
      
      - name: Lint
        run: npm run lint
        working-directory: ./src/bicep-types
      
      - name: Test
        run: npm test
        working-directory: ./src/bicep-types
      
      - name: Build
        run: npm run build
        working-directory: ./src/bicep-types

      - name: Package
        run: |
          npm run package
          mv azure-bicep-types-*.tgz azure-bicep-types.tgz
        working-directory: ./src/bicep-types

      - name: Upload NPM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-bicep-types.tgz
          path: ./src/bicep-types/azure-bicep-types.tgz
          if-no-files-found: error

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.4'
          cache-dependency-path: ./src/bicep-types-go/go.sum

      - name: Verify dependencies
        run: go mod verify
        working-directory: ./src/bicep-types-go

      - name: Download dependencies
        run: go mod download
        working-directory: ./src/bicep-types-go

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run
        working-directory: ./src/bicep-types-go

      - name: Build
        run: go build -v ./...
        working-directory: ./src/bicep-types-go

      - name: Test (Unit)
        run: go test -v -race -coverprofile=coverage.out ./...
        working-directory: ./src/bicep-types-go

      - name: Build CLI binary
        run: |
          go build -o bicep-types ./cmd/bicep-types
          chmod +x bicep-types
        working-directory: ./src/bicep-types-go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9